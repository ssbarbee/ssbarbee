name: Update README.md

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

# Runs queue instead of overlapping, so two runs never race to push regenerated cards.
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn --immutable

      # Rendered by src/cards; a card that fails keeps its previous SVG
      - name: Generate GitHub cards
        id: cards
        continue-on-error: true
        run: yarn cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Contributions only change over the day, so code pushes skip the graph
      - name: Generate 3D contribution graph
        id: graph
        if: github.event_name != 'push'
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Light and dark variants matching GitHub's page backgrounds and the cards' palette
          SETTING_JSON: .github/profile-3d.json

      - name: Update README file
        run: yarn update
      - name: Commit and push new README.md
        run: |-
          git config --global user.name "ssbarbee"
          git config --global user.email "ssbarbee@gmail.com"
          git add profile/ profile-3d-contrib/ README.md
          git commit -m "chore: content update" || exit 0
          git pull --rebase && git push
      - name: Fail when profile images were not generated
        if: steps.cards.outcome == 'failure' || steps.graph.outcome == 'failure'
        run: |
          echo "::error::Some profile images failed to generate; their previous versions were kept."
          exit 1
