name: Update README.md

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.9.0'
          cache: 'yarn'
      - name: Cache dependencies and build outputs
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-js-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn --immutable

      # Rendered by src/cards; a card that fails keeps its previous SVG
      - name: Generate GitHub cards
        id: cards
        continue-on-error: true
        run: yarn cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README file
        run: yarn update
      - name: Commit and push new README.md
        run: |-
          git config --global user.name "ssbarbee"
          git config --global user.email "ssbarbee@gmail.com"
          git add profile/
          git add README.md
          git commit -m "chore: content update" || exit 0
          git push
      - name: Fail when GitHub cards were not generated
        if: steps.cards.outcome == 'failure'
        run: |
          echo "::error::Some GitHub cards failed to generate; their previous SVGs were kept."
          exit 1
