name: Update README.md

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn --immutable

      # Rendered by src/cards; a card that fails keeps its previous SVG
      - name: Generate GitHub cards
        id: cards
        continue-on-error: true
        run: yarn cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README file
        run: yarn update
      - name: Commit and push new README.md
        run: |-
          git config --global user.name "ssbarbee"
          git config --global user.email "ssbarbee@gmail.com"
          git add profile/
          git add README.md
          git commit -m "chore: content update" || exit 0
          git pull --rebase && git push
      - name: Fail when GitHub cards were not generated
        if: steps.cards.outcome == 'failure'
        run: |
          echo "::error::Some GitHub cards failed to generate; their previous SVGs were kept."
          exit 1
